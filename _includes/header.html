<header>
  <a href="/" class="logo"><img src="/assets/img/ndina-logo.png" alt="NDINA Gallery"></a>
  <nav class="desktop-nav">
    <a href="/"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
    <a href="/artists/"{% if page.url contains "/artists/" %} class="active"{% endif %}>Artists</a>
    <a href="/artwaka/"{% if page.url contains "/artwaka/" %} class="active"{% endif %}>Artwaka</a>
    <a href="/studio/"{% if page.url contains "/studio/" %} class="active"{% endif %}>Studio</a>
    <a href="/connect/"{% if page.url contains "/connect/" %} class="active"{% endif %}>Connect</a>
    <button class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
  </nav>
  <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false">
    <span class="bars"><span></span><span></span><span></span></span>
  </button>
</header>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
  </div>
  <nav>
    <a href="/"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
    <a href="/artists/"{% if page.url contains "/artists/" %} class="active"{% endif %}>Artists</a>
    <a href="/artwaka/"{% if page.url contains "/artwaka/" %} class="active"{% endif %}>Artwaka</a>
    <a href="/studio/"{% if page.url contains "/studio/" %} class="active"{% endif %}>Studio</a>
    <a href="/connect/"{% if page.url contains "/connect/" %} class="active"{% endif %}>Connect</a>
  </nav>
  <div class="drawer-foot">
    <span class="small">NDINA Gallery</span>
    <button class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
  </div>
</aside>
