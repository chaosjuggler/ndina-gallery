<style>
  :root{--ink:#121212;--paper:#FFFFFF;--clay:#CE6345;--clay-soft:#E08D74;--stone:#5B5854;--line:rgba(18,18,18,.13);--sans:'Jost',sans-serif;}
  [data-theme="dark"]{--ink:#F4F1EC;--paper:#000000;--stone:#9C9892;--line:rgba(244,241,236,.18);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px calc(40px + env(safe-area-inset-bottom));}
  a{color:inherit;text-decoration:none;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;}
  .logo{height:34px;width:auto;margin-bottom:18px;}
  [data-theme="dark"] .logo{filter:brightness(0) invert(1);}
  .tag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);text-align:center;margin-bottom:40px;}
  .links{list-style:none;width:100%;display:flex;flex-direction:column;gap:14px;}
  .lk{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 22px;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s,border-color .2s;}
  .lk b{display:block;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;}
  .lk small{display:block;margin-top:5px;font-size:13px;letter-spacing:.02em;opacity:.72;}
  .lk svg{flex:none;width:20px;height:20px;transition:transform .2s;}
  .lk:hover,.lk:focus-visible{background:var(--ink);color:var(--paper);}
  .lk:hover svg,.lk:focus-visible svg{transform:translateX(3px);}
  .lk.primary{background:var(--clay);border-color:var(--clay);color:#fff;}
  .lk.primary:hover,.lk.primary:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .lk:focus-visible{outline:2px solid var(--clay);outline-offset:3px;}
  .foot{margin-top:44px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);text-align:center;}
  .foot a{border-bottom:1px solid var(--line);}
</style>
</head>

    <li><a class="lk" href="/?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=links"><span><b>Gallery Homepage</b><small>Artists, exhibitions and journal</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
    <li><a class="lk" href="https://shop.ndina.gallery/?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=links"><span><b>NDINA Shop</b><small>Limited edition prints and originals</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
  </ul>
  <p class="foot"><a href="/">ndina.gallery</a></p>
