<!DOCTYPE html>
<html lang="en"{% if page.theme_default %} data-theme-default="{{ page.theme_default }}"{% endif %}>
<head>
<script>
(function(){
  var saved = localStorage.getItem('ndina-theme');
  var theme = saved || document.documentElement.getAttribute('data-theme-default') || 'light';
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}NDINA Gallery</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">

<meta name="description" content="{{ page.description | default: site.description }}">

<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}NDINA Gallery">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} — {% endif %}NDINA Gallery">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}/og-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
</head>
<body>

{% unless page.custom_header %}{% include header.html %}{% endunless %}

{{ content }}

{% include footer.html %}

<script src="/assets/js/site.js"></script>
</body>
</html>
